<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CS180 Project 1 Results</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />

<body>

    <section>
      <div class="section-head">
        <h2>Test Results</h2>
        <span class="count" id="test-results-count"></span>
      </div>
      <div class="grid" id="test-results-grid"></div>
    </section>
  </main>

  <footer class="footer">
    <p>Hosted from the <strong>web</strong> branch on GitHub Pages.</p>
  </footer>

  <script src="web/app.js"></script>
